# Explicit opt-in only. Seed the private host directory before starting workers.
services:
  api:
    user: "${TIKTOK_CREDENTIAL_UID:?Set credential owner UID visible inside container}:${TIKTOK_CREDENTIAL_GID:?Set credential owner GID visible inside container}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16777216"]
    environment: &private_tiktok_environment
      TIKTOK_CREDENTIAL_STORE: /run/dash-tiktok/.tiktok-credentials
      TIKTOK_RENEWAL_RUNTIME: docker
      TIKTOK_AUTO_REFRESH_ENABLED: ${TIKTOK_AUTO_REFRESH_ENABLED:-false}
      TIKTOK_REFRESH_SKEW_SECONDS: ${TIKTOK_REFRESH_SKEW_SECONDS:-300}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
    volumes: &private_tiktok_mount
      - type: bind
        source: ${TIKTOK_CREDENTIAL_DIRECTORY:?Set an approved persistent private token directory}
        target: /run/dash-tiktok/.tiktok-credentials
        bind:
          create_host_path: false
  scheduler:
    user: "${TIKTOK_CREDENTIAL_UID:?Set credential owner UID visible inside container}:${TIKTOK_CREDENTIAL_GID:?Set credential owner GID visible inside container}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16777216"]
    environment: *private_tiktok_environment
    volumes: *private_tiktok_mount
