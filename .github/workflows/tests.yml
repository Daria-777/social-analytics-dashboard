name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: test_dash
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test_dash"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://test:test-only-password@localhost:5432/test_dash
      TEST_DATABASE_URL: postgresql+psycopg://test:test-only-password@localhost:5432/test_dash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/frontend_contract.mjs
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m tests.postgres_migrations
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
      - run: python -m tests.postgres_contract
      - run: alembic downgrade base
