{
  "services": {
    "db": {
      "image": "postgres:16",
      "restart": "unless-stopped",
      "environment": {
        "POSTGRES_USER": "${POSTGRES_USER:-dash}",
        "POSTGRES_DB": "${POSTGRES_DB:-dash}",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?Set private POSTGRES_PASSWORD}"
      },
      "volumes": [
        "postgres_data:/var/lib/postgresql/data"
      ],
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 20
      }
    },
    "migrate": {
      "build": ".",
      "environment": {
        "DATABASE_URL": "${DATABASE_URL:?Set private DATABASE_URL}"
      },
      "command": [
        "alembic",
        "upgrade",
        "head"
      ],
      "networks": [
        "backend"
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      }
    },
    "api": {
      "build": ".",
      "restart": "unless-stopped",
      "environment": {
        "DATABASE_URL": "${DATABASE_URL:?Set private DATABASE_URL}",
        "INTERNAL_API_KEY": "${INTERNAL_API_KEY:?Set private INTERNAL_API_KEY}",
        "DISPLAY_TIMEZONE": "${DISPLAY_TIMEZONE:-Europe/Moscow}",
        "DASHBOARD_SESSION_HOURS": "${DASHBOARD_SESSION_HOURS:-8}",
        "SCHEDULER_ENABLED": "${SCHEDULER_ENABLED:-false}",
        "INSTAGRAM_ACCESS_TOKEN": "${INSTAGRAM_ACCESS_TOKEN:-}",
        "INSTAGRAM_USER_ID": "${INSTAGRAM_USER_ID:-}",
        "INSTAGRAM_API_VERSION": "${INSTAGRAM_API_VERSION:-v26.0}",
        "INSTAGRAM_EXPECTED_USERNAME": "${INSTAGRAM_EXPECTED_USERNAME:-demo.account}",
        "TIKTOK_ACCESS_TOKEN": "${TIKTOK_ACCESS_TOKEN:-}",
        "TIKTOK_OPEN_ID": "${TIKTOK_OPEN_ID:-}",
        "TIKTOK_SCOPES": "${TIKTOK_SCOPES:-user.info.basic,user.info.profile,user.info.stats,video.list}",
        "TIKTOK_EXPECTED_USERNAME": "${TIKTOK_EXPECTED_USERNAME:-demo.account}",
        "SCHEDULER_DAILY_HOUR_UTC": "${SCHEDULER_DAILY_HOUR_UTC:-9}",
        "SCHEDULER_POLL_SECONDS": "${SCHEDULER_POLL_SECONDS:-900}",
        "SCHEDULER_MAX_ATTEMPTS": "${SCHEDULER_MAX_ATTEMPTS:-3}",
        "SCHEDULER_RETRY_MINUTES": "${SCHEDULER_RETRY_MINUTES:-30}",
        "SCHEDULER_MAX_LATENESS_HOURS": "${SCHEDULER_MAX_LATENESS_HOURS:-2}",
        "SCHEDULER_MAX_JOBS_PER_TICK": "${SCHEDULER_MAX_JOBS_PER_TICK:-2}",
        "INSTAGRAM_MAX_PAGES": "${INSTAGRAM_MAX_PAGES:-100}",
        "TIKTOK_MAX_PAGES": "${TIKTOK_MAX_PAGES:-100}"
      },
      "command": [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "${DASH_PROXY_IP:-172.30.252.2}",
        "--no-access-log",
        "--log-config",
        "logging.json"
      ],
      "networks": [
        "backend",
        "edge"
      ],
      "depends_on": {
        "migrate": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 3
      }
    },
    "scheduler": {
      "build": ".",
      "restart": "unless-stopped",
      "profiles": [
        "scheduler"
      ],
      "environment": {
        "DATABASE_URL": "${DATABASE_URL:?Set private DATABASE_URL}",
        "INTERNAL_API_KEY": "${INTERNAL_API_KEY:?Set private INTERNAL_API_KEY}",
        "DISPLAY_TIMEZONE": "${DISPLAY_TIMEZONE:-Europe/Moscow}",
        "DASHBOARD_SESSION_HOURS": "${DASHBOARD_SESSION_HOURS:-8}",
        "SCHEDULER_ENABLED": "${SCHEDULER_ENABLED:-false}",
        "INSTAGRAM_ACCESS_TOKEN": "${INSTAGRAM_ACCESS_TOKEN:-}",
        "INSTAGRAM_USER_ID": "${INSTAGRAM_USER_ID:-}",
        "INSTAGRAM_API_VERSION": "${INSTAGRAM_API_VERSION:-v26.0}",
        "INSTAGRAM_EXPECTED_USERNAME": "${INSTAGRAM_EXPECTED_USERNAME:-demo.account}",
        "TIKTOK_ACCESS_TOKEN": "${TIKTOK_ACCESS_TOKEN:-}",
        "TIKTOK_OPEN_ID": "${TIKTOK_OPEN_ID:-}",
        "TIKTOK_SCOPES": "${TIKTOK_SCOPES:-user.info.basic,user.info.profile,user.info.stats,video.list}",
        "TIKTOK_EXPECTED_USERNAME": "${TIKTOK_EXPECTED_USERNAME:-demo.account}",
        "SCHEDULER_DAILY_HOUR_UTC": "${SCHEDULER_DAILY_HOUR_UTC:-9}",
        "SCHEDULER_POLL_SECONDS": "${SCHEDULER_POLL_SECONDS:-900}",
        "SCHEDULER_MAX_ATTEMPTS": "${SCHEDULER_MAX_ATTEMPTS:-3}",
        "SCHEDULER_RETRY_MINUTES": "${SCHEDULER_RETRY_MINUTES:-30}",
        "SCHEDULER_MAX_LATENESS_HOURS": "${SCHEDULER_MAX_LATENESS_HOURS:-2}",
        "SCHEDULER_MAX_JOBS_PER_TICK": "${SCHEDULER_MAX_JOBS_PER_TICK:-2}",
        "INSTAGRAM_MAX_PAGES": "${INSTAGRAM_MAX_PAGES:-100}",
        "TIKTOK_MAX_PAGES": "${TIKTOK_MAX_PAGES:-100}"
      },
      "command": [
        "python",
        "-m",
        "app.cli.scheduler"
      ],
      "networks": [
        "backend"
      ],
      "depends_on": {
        "migrate": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "proxy": {
      "image": "caddy:2",
      "restart": "unless-stopped",
      "environment": {
        "DASH_DOMAIN": "${DASH_DOMAIN:?Set actual server DNS hostname}"
      },
      "ports": [
        "80:80",
        "443:443"
      ],
      "volumes": [
        "./deploy/Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy_data:/data",
        "caddy_config:/config"
      ],
      "networks": {
        "edge": {
          "ipv4_address": "${DASH_PROXY_IP:-172.30.252.2}"
        }
      },
      "depends_on": {
        "api": {
          "condition": "service_healthy"
        }
      }
    }
  },
  "networks": {
    "backend": {},
    "edge": {
      "ipam": {
        "config": [
          {
            "subnet": "${DASH_EDGE_SUBNET:-172.30.252.0/24}"
          }
        ]
      }
    }
  },
  "volumes": {
    "postgres_data": {},
    "caddy_data": {},
    "caddy_config": {}
  }
}
